[package]
name = "vpng-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "The VPNG Python extension: the stable Rust APIs, exposed to Python."

[lib]
# The extension module is `vpng._vpng`; the Rust library is named
# `vpng_python` because a library and an extension module cannot share a
# name on every platform.
name = "vpng_python"
crate-type = ["cdylib"]
# The crate has no Rust test target: the extension links against the Python
# C API, so its tests are the Python test suite in `python/tests`, which
# runs against the built module. Without this, `cargo test --workspace`
# would try to link a test harness against libpython.
test = false
doctest = false

[dependencies]
vpng-core.workspace = true
vpng-container.workspace = true
vpng-codecs.workspace = true
vpng-encoder.workspace = true
vpng-decoder.workspace = true
vpng-source.workspace = true
vpng-editing.workspace = true
vpng-image.workspace = true
# `abi3-py38` gives one wheel for every CPython from 3.8 onwards, and
# `extension-module` keeps the crate from linking libpython on Linux and
# macOS. On Windows the stable-ABI import library (`python3.lib`) is used.
pyo3 = { version = "0.27", features = ["abi3-py38", "extension-module"] }
