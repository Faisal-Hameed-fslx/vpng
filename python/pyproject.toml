[project]
name = "vpng-experiments"
version = "0.1.0"
description = "Experimental tooling, corpus preparation, and reporting for VPNG. Not the codec: the codec lives in Rust."
requires-python = ">=3.10"
dependencies = [
    # Pillow is used only to prepare and inspect corpus images, never to define
    # pixel semantics. The Rust codec is the single source of truth.
    "Pillow>=10.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
