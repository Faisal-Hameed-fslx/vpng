[workspace]
resolver = "2"
members = [
    "crates/vpng-core",
    "crates/vpng-container",
    "crates/vpng-cache",
    "crates/vpng-codecs",
    "crates/vpng-tiling",
    "crates/vpng-encoder",
    "crates/vpng-decoder",
    "crates/vpng-source",
    "crates/vpng-view",
    "crates/vpng-editing",
    "crates/vpng-fuzzing",
    "crates/vpng-testkit",
    "crates/vpng-cli",
    "crates/vpng-research",
    "crates/vpng-validation",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
authors = ["VPNG contributors"]
description = "VPNG: a lossless, adaptive, tiled, random-access image format and editing engine"
repository = "https://example.invalid/vpng"

[workspace.dependencies]
vpng-core = { path = "crates/vpng-core" }
vpng-container = { path = "crates/vpng-container" }
vpng-cache = { path = "crates/vpng-cache" }
vpng-codecs = { path = "crates/vpng-codecs" }
vpng-tiling = { path = "crates/vpng-tiling" }
vpng-encoder = { path = "crates/vpng-encoder" }
vpng-decoder = { path = "crates/vpng-decoder" }
vpng-source = { path = "crates/vpng-source" }
vpng-view = { path = "crates/vpng-view" }
vpng-editing = { path = "crates/vpng-editing" }
vpng-fuzzing = { path = "crates/vpng-fuzzing" }
vpng-testkit = { path = "crates/vpng-testkit" }
vpng-validation = { path = "crates/vpng-validation" }
crc32c = "0.6"
sha2 = "0.10"
png = "0.17"

# Deterministic, reproducible release builds.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
