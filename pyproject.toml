[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "vpng"
version = "0.1.0"
description = "VPNG: a lossless, adaptive, tiled, random-access image format and editing engine"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "VPNG contributors" }]
keywords = ["image", "lossless", "tiles", "random-access", "editing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
# The extension has no runtime dependencies: the Rust code is the codec.
dependencies = []

[project.urls]
Repository = "https://github.com/Faisal-Hameed-fslx/vpng"

[tool.maturin]
manifest-path = "crates/vpng-python/Cargo.toml"
module-name = "vpng._vpng"
python-source = "python"
features = ["pyo3/extension-module"]
strip = true
