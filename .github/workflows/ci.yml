name: CI

# The CI suite is the gate for every change to the repository. It runs the
# same commands a developer runs locally, plus the fuzzing jobs.
#
# The jobs are deliberately split so a failure points at one thing:
#
# * `fmt`        — the formatting check.
# * `clippy`     — the lint check, with warnings treated as errors.
# * `build`      — every target of every crate compiles.
# * `test`       — the whole test suite.
# * `golden`     — the golden fixtures, named on their own so a change to
#                  the binary format is obvious in the job list.
# * `fuzz-smoke` — the deterministic mutation harness over every parser.
# * `fuzz`       — the coverage-guided `cargo-fuzz` targets, on nightly.
# * `release`    — the release profile builds.
# * `python`     — the benchmark and corpus scripts still parse, and the
#                  milestone reports still match the raw data.
# * `python-ext` — the native extension builds and its own test suite passes.
# * `wasm`       — the WebAssembly module builds for `wasm32` and produces the
#                  command line's pixels.
#
# The HTTP Range crate and the WebAssembly package are covered by the
# ordinary `build`, `clippy` and `test` jobs: they are workspace members
# with their own tests.

on:
  push:
    # Both names are listed: the repository's branch is `master`, and a
    # GitHub-hosted fork usually renames it `main`. The coverage-guided fuzz
    # job must run on either.
    branches: [main, master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check the formatting
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint every target
        run: cargo clippy --workspace --all-targets -- -D warnings

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build every target
        run: cargo build --workspace --all-targets

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the test suite
        run: cargo test --workspace --all-targets

  golden:
    name: golden fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The golden fixtures must not change
        run: cargo test -p vpng-testkit --test golden -- --nocapture

  fuzz-smoke:
    name: fuzz (deterministic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the mutation harness
        run: |
          cargo run --release -p vpng-fuzzing --bin vpng-fuzz-mutate -- \
            --iterations 50000 \
            --output fuzz-smoke.json
      - name: Publish the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-smoke-report
          path: fuzz-smoke.json
          if-no-files-found: ignore

  fuzz:
    name: fuzz (coverage guided)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Fuzz every target
        run: |
          set -e
          # `--fuzz-dir` is cargo-fuzz's fuzz *project* directory (the one
          # holding fuzz/Cargo.toml). The corpus and the crash artifacts live
          # under fuzz/corpus/<target> and fuzz/artifacts/<target>.
          #
          # A target that finds something must not stop the others: the job
          # runs all seven, records the failures, and fails at the end. One
          # run therefore covers the whole target set, and the summary says
          # exactly which targets found something.
          failures=""
          for target in header directory container tile_payload experimental_codec region editing; do
            echo "::group::fuzz $target"
            status=0
            cargo +nightly fuzz run "$target" --fuzz-dir fuzz -- -max_total_time=120 -rss_limit_mb=4096 || status=$?
            echo "::endgroup::"
            if [ "$status" -ne 0 ]; then
              echo "::error title=Fuzzing found something::target $target exited with $status"
              failures="$failures $target"
            fi
          done
          if [ -n "$failures" ]; then
            echo "targets with findings:$failures"
            exit 1
          fi
      - name: Publish the corpus
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-corpus
          path: fuzz/corpus
          if-no-files-found: ignore
      - name: Publish the crash artifacts
        # The crash input libFuzzer wrote is the only way to reproduce a
        # finding locally, so it is uploaded even when the job fails.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  release:
    name: release build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the release profile
        run: cargo build --workspace --release

  python:
    name: python scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the script dependencies
        # The corpus scripts import Pillow (the baseline encoders and the
        # canonicaliser) and numpy (the synthetic generator and the seed
        # corpus). Without them the scripts cannot even be imported, so the
        # "must show its help" checks below would fail for the wrong reason.
        run: python -m pip install --upgrade pillow numpy
      - name: The scripts must parse
        run: |
          python -m compileall -q benchmarks python
      - name: The research runner must show its help
        run: python benchmarks/corpus/run_research.py --help
      - name: The corpus runner must show its help
        run: python benchmarks/corpus/run_corpus.py --help
      - name: The corpus builder must show its help
        run: python benchmarks/corpus/build_corpus.py --help
      - name: The corpus statistics rules must be pinned
        run: python benchmarks/corpus/run_corpus.py --self-test
      - name: The seed generator must show its help
        run: python benchmarks/corpus/seed.py --help
      - name: The synthetic generator must show its help
        run: python benchmarks/stress/gen_synthetic.py --help
      - name: The memory runner must show its help
        run: python benchmarks/memory/run_memory.py --help
      - name: The HTTP runner must show its help
        run: python benchmarks/http/run_http_bench.py --help
      - name: The WebAssembly runner must show its help
        run: python benchmarks/wasm/run_wasm_bench.py --help
      - name: The layer corpus runner must show its help
        run: python benchmarks/corpus/run_layers_corpus.py --help
      - name: The layer memory runner must show its help
        run: python benchmarks/layers/measure_layer_memory.py --help
      - name: The reports must match the raw data
        run: python benchmarks/verify_reports.py

  python-ext:
    name: python extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create a virtual environment
        # `maturin develop` installs into a virtual environment, and the
        # interpreter that `setup-python` provides is not one. The
        # environment lives in `.venv`, where maturin also finds it.
        run: python -m venv .venv
      - name: Install maturin
        # maturin is the build backend the root `pyproject.toml` names, so
        # the wheel is built exactly the way a user would build it.
        run: .venv/bin/python -m pip install --upgrade "maturin>=1.5,<2.0"
      - name: Build and install the extension
        # `maturin develop` puts the compiled module on the interpreter's
        # path. The extension uses the stable ABI, so the same wheel works on
        # every CPython from 3.8 onwards.
        run: .venv/bin/maturin develop --release
      - name: Run the extension test suite
        # The tests use nothing but the standard library: they write and read
        # their own PNG files, so the job needs no imaging dependency.
        run: .venv/bin/python -m unittest discover -s python/tests -v
      - name: The extension must be importable on its own
        # `import vpng._vpng` must work without the Python wrapper, so the
        # module never depends on the wrapper being imported first.
        run: .venv/bin/python -c "import vpng._vpng as m; print(m.FORMAT_VERSION, m.__version__)"
      - name: Build the wheel
        run: .venv/bin/maturin build --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: python-wheels
          path: dist
          if-no-files-found: error

  wasm:
    name: wasm module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build the module for wasm32
        # The module is a plain `cdylib`: the target and a release build are
        # the whole toolchain. There is no `wasm-pack` and no code generation.
        run: cargo build --release --target wasm32-unknown-unknown -p vpng-wasm
      - name: Build the command line
        # The tests compare the module against the real binary, so the binary
        # has to exist.
        run: cargo build --release -p vpng-cli
      - name: Run the module's test suite
        # The tests encode an image with the command line, decode it with
        # both, and compare the canonical digests: the module's pixels are
        # the command line's pixels.
        run: node --test wasm/test/vpng.test.mjs
      - name: The module must export its functions
        run: node wasm/check_exports.mjs
